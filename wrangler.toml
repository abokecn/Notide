name = "notide-sync"
main = "workers/index.js"
compatibility_date = "2026-08-17"

# Wrangler 4.120+ provisions or reuses these named resources during deployment.
# Account-specific resource IDs stay in Cloudflare and never need to be committed.
[[d1_databases]]
binding = "DB"
database_name = "notide"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "NOTES_BUCKET"
bucket_name = "notide-notes"
