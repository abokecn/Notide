name: Notide build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: notide-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066"
      - name: Export Android NDK path
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx tauri android init
      - name: Install Notide Android icons
        shell: bash
        run: cp -R src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
      - name: Build Android debug APK
        shell: bash
        env:
          NO_COLOR: 1
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          npm run native:android -- --target aarch64 --verbose 2>&1 | tee android-build.log
      - name: Publish Android failure details
        if: failure()
        shell: bash
        run: |
          if [[ -f android-build.log ]]; then
            details="$(tail -n 120 android-build.log)"
          else
            details="The build stopped before the Android log was created."
          fi
          {
            echo "### Android build failure"
            echo '```text'
            printf '%s\n' "$details"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f android-build.log ]]; then
            fallback="$(tail -n 45 android-build.log | tail -c 3500)"
            post_rust="$(awk '/> Task :app:rustBuildArm64Debug/ { capture=1 } capture && /FAILURE: Build failed with an exception/ { exit } capture && NF && length($0) <= 800 && $0 !~ /file or directory .* not found|Could not execute \[report metric|Error \[tauri_cli_node\] failed to build APK|Error failed to build APK|Io\(BeforeSpawn|Cmd\(\[/ { print }' android-build.log | tail -n 160 | tail -c 7000)"
            gradle="$(awk '/FAILURE: Build failed with an exception/ { capture=1 } capture && length($0) <= 800 { print } capture && /BUILD FAILED/ { exit }' android-build.log | head -c 3500)"
            filtered="$(awk 'BEGIN { IGNORECASE=1 } /FAILURE:|What went wrong|Execution failed|Caused by:|error:|A problem occurred|Could not|failed to|not found|No such file|Exception|missing|required runtime symbols|failed to validate library|unsupported/ && $0 !~ /not found file or directory|Could not execute \[report metric|Error \[tauri_cli_node\] failed to build APK|Error failed to build APK|Io\(BeforeSpawn|Cmd\(\[/ && length($0) <= 800 { print }' android-build.log | tail -n 80 | tail -c 3500)"
          else
            fallback="$details"
            post_rust=""
            gradle=""
            filtered=""
          fi
          if [[ -n "$post_rust" ]]; then
            post_rust="${post_rust//'%'/'%25'}"
            post_rust="${post_rust//$'\r'/'%0D'}"
            post_rust="${post_rust//$'\n'/'%0A'}"
            echo "::error title=Android post-Rust failure::$post_rust"
          fi
          if [[ -n "$gradle" ]]; then
            gradle="${gradle//'%'/'%25'}"
            gradle="${gradle//$'\r'/'%0D'}"
            gradle="${gradle//$'\n'/'%0A'}"
            echo "::error title=Android Gradle failure::$gradle"
          fi
          if [[ -n "$filtered" ]]; then
            filtered="${filtered//'%'/'%25'}"
            filtered="${filtered//$'\r'/'%0D'}"
            filtered="${filtered//$'\n'/'%0A'}"
            echo "::error title=Android matched errors::$filtered"
          fi
          if [[ -z "$post_rust$gradle$filtered" ]]; then
            fallback="${fallback//'%'/'%25'}"
            fallback="${fallback//$'\r'/'%0D'}"
            fallback="${fallback//$'\n'/'%0A'}"
            echo "::error title=Android build failure::$fallback"
          fi
      - name: Upload Android build log
        if: ${{ failure() && hashFiles('android-build.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: notide-android-build-log
          path: android-build.log
          retention-days: 3
          if-no-files-found: error
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: notide-android
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
