name: Notide build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: notide-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13846066"
      - name: Export Android NDK path
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx tauri android init
      - name: Build Android debug APK
        shell: bash
        env:
          NO_COLOR: 1
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          npm run native:android 2>&1 | tee android-build.log
      - name: Publish Android failure details
        if: failure()
        shell: bash
        run: |
          {
            echo "### Android build failure"
            echo '```text'
            if [[ -f android-build.log ]]; then
              tail -n 120 android-build.log
              details="$(tail -n 120 android-build.log)"
              details="${details//'%'/'%25'}"
              details="${details//$'\r'/'%0D'}"
              details="${details//$'\n'/'%0A'}"
              echo "::error title=Android build failure::$details"
            else
              echo "The build stopped before the Android log was created."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: notide-android
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
