[package]
name = "notide"
version = "0.1.0"
description = "Notide native shell"
authors = ["Notide"]
edition = "2021"

[lib]
name = "notide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
